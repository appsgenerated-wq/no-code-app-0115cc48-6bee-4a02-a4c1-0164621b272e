name: OnionApp

entities:
  User:
    authenticable: true
    properties:
      - name
      - name: email
        type: email
      - name: role
        type: choice
        options:
          values: [admin, user]
        default: user
    policies:
      create:
        - access: admin
      read:
        - access: restricted
          allow: User
          condition: self
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: admin
      signup:
        - access: public

  OnionVariety:
    properties:
      - name: name
        type: string
      - name: color
        type: choice
        options:
          values: ['Red', 'White', 'Yellow', 'Green', 'Sweet']
        default: 'Yellow'
      - name: description
        type: text
      - name: flavorProfile
        type: richText
      - name: origin
        type: string
      - name: photo
        type: image
        options:
          sizes:
            thumbnail:
              width: 150
              height: 150
            medium:
              width: 600
              height: 600
    belongsTo:
      - name: owner
        entity: User
    policies:
      create:
        - access: restricted
          allow: User
      read:
        - access: public
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: restricted
          allow: User
          condition: self


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck